<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
<link rel="shortcut icon" href="/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/favicon/site.webmanifest" />
{{- if not .Params.cover.image }}
<meta property="og:image" content="{{ "dbj-org-logo.jpg" | absURL }}" />
<meta property="twitter:image" content="{{ "dbj-org-logo.jpg" | absURL }}" />
{{- end }}
<style>
  .entry-tags a {
    color: #888;
    text-decoration: none;
    display: inline-block;
    padding: 6px 12px;
    margin: 4px 6px 4px 0;
  }
  .entry-tags a:hover {
    color: #fff;
    text-decoration: underline;
  }
  .dbj-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin: 24px 0;
  }
  .dbj-gallery-item {
    margin: 0;
    overflow: hidden;
    border-radius: var(--radius);
    background: var(--entry);
  }
  .dbj-gallery-item img {
    display: block;
    width: 100%;
    height: 180px;
    object-fit: cover;
    transition: transform .2s ease;
  }
  .dbj-gallery-item img:hover {
    transform: scale(1.04);
  }
  .dbj-lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0, 0, 0, .92);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dbj-lightbox[hidden] {
    display: none;
  }
  .dbj-lb-img {
    max-width: 92vw;
    max-height: 88vh;
    object-fit: contain;
  }
  .dbj-lb-caption {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ddd;
    font-size: 14px;
    padding: 0 60px;
    word-break: break-all;
  }
  .dbj-lightbox button {
    position: absolute;
    background: none;
    border: 0;
    color: #fff;
    cursor: pointer;
    line-height: 1;
    opacity: .75;
    padding: 8px 16px;
  }
  .dbj-lightbox button:hover {
    opacity: 1;
  }
  .dbj-lb-close {
    top: 10px;
    right: 14px;
    font-size: 40px;
  }
  .dbj-lb-prev, .dbj-lb-next {
    top: 50%;
    transform: translateY(-50%);
    font-size: 60px;
  }
  .dbj-lb-prev { left: 6px; }
  .dbj-lb-next { right: 6px; }
  .gallery-card .entry-cover img {
    width: 50%;
    margin: 0 auto;
  }
</style>
